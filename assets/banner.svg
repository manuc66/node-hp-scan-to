<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#99f6e4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#99f6e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="lightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="#ffffff"/>
  <circle cx="868" cy="270" r="380" fill="url(#glow)"/>

  <!-- scanner page: a document being scanned, light emitted by the scan bar -->
  <g transform="translate(338,300) scale(0.8)">
    <rect x="-60" y="-80" width="28" height="160" rx="6" fill="#1e293b"/>
    <rect x="32" y="-80" width="28" height="160" rx="6" fill="#1e293b"/>
    <g fill="#cbd5e1">
      <rect x="-28" y="-52" width="52" height="5" rx="2.5"/>
      <rect x="-28" y="-36" width="36" height="5" rx="2.5"/>
      <rect x="-28" y="-20" width="44" height="5" rx="2.5"/>
      <rect x="-28" y="26" width="52" height="5" rx="2.5"/>
      <rect x="-28" y="42" width="36" height="5" rx="2.5"/>
      <rect x="-28" y="58" width="44" height="5" rx="2.5"/>
    </g>
    <rect x="-60" y="-6" width="120" height="22" rx="11" fill="url(#scanGrad)"/>
    <polygon points="-60,16 60,16 85,95 -85,95" fill="url(#lightGrad)"/>
    <g fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.4">
      <path d="M -30 18 V 70"/>
      <path d="M 0 18 V 88"/>
      <path d="M 30 18 V 64"/>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(558,300) scale(0.5)" fill="none" stroke="#0f766e" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 0 H 78"/>
    <path d="M 54 -28 L 84 0 L 54 28"/>
  </g>

  <!-- monitor: side bezels form an "H", the crossbar is the laser scan line -->
  <g transform="translate(868,300) scale(0.95)">
    <rect x="-130" y="-150" width="260" height="270" rx="20" fill="#ffffff" stroke="#1e293b" stroke-width="14"/>
    <rect x="-114" y="-134" width="228" height="238" rx="12" fill="url(#screenGrad)"/>
    <rect x="-95" y="-110" width="44" height="220" rx="10" fill="#1e293b"/>
    <rect x="51" y="-110" width="44" height="220" rx="10" fill="#1e293b"/>
    <rect x="-95" y="-16" width="190" height="32" rx="16" fill="url(#scanGrad)"/>
    <circle cx="95" cy="0" r="7" fill="#ccfbf1"/>
    <rect x="-12" y="120" width="24" height="28" fill="#1e293b"/>
    <rect x="-48" y="148" width="96" height="14" rx="7" fill="#1e293b"/>
  </g>

  <text x="640" y="585" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="800" letter-spacing="14" fill="#0f766e">SCAN TO</text>
</svg>