<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="#ffffff"/>

  <!-- H inside a screen (monitor) — the visual anchor -->
  <g transform="translate(640,320) scale(1.8)">
    <!-- monitor frame -->
    <rect x="-100" y="-80" width="200" height="160" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
    <rect x="-86" y="-66" width="172" height="132" rx="6" fill="url(#screenGrad)"/>
    <!-- H on screen: side bezels = H verticals, scan line = crossbar -->
    <rect x="-64" y="-50" width="24" height="100" rx="4" fill="#1e293b"/>
    <rect x="40" y="-50" width="24" height="100" rx="4" fill="#1e293b"/>
    <rect x="-64" y="0" width="128" height="18" rx="9" fill="url(#scanGrad)"/>
    <circle cx="64" cy="9" r="4" fill="#ccfbf1"/>
    <!-- tiny arrow → computer (subtle) -->
    <g transform="translate(110, 10)" fill="#0f766e">
      <path d="M 0 0 L 30 0 M 22 -6 L 30 0 L 22 6" stroke="#0f766e" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
    <!-- stand -->
    <rect x="-8" y="80" width="16" height="16" fill="#1e293b"/>
    <rect x="-20" y="96" width="40" height="6" rx="3" fill="#1e293b"/>
  </g>
</svg>