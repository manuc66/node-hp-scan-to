<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="#ffffff"/>

  <!-- H mark (the scan) -->
  <g transform="translate(440,320) scale(1.3)">
    <rect x="-64" y="-50" width="24" height="100" rx="4" fill="#1e293b"/>
    <rect x="40" y="-50" width="24" height="100" rx="4" fill="#1e293b"/>
    <rect x="-64" y="0" width="128" height="18" rx="9" fill="url(#scanGrad)"/>
    <circle cx="64" cy="9" r="4" fill="#ccfbf1"/>
  </g>

  <!-- arrow -->
  <g transform="translate(620,320) scale(0.8)" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 0 H 70"/>
    <path d="M 48 -20 L 70 0 L 48 20"/>
  </g>

  <!-- screen (the computer) -->
  <g transform="translate(820,320) scale(1.15)">
    <rect x="-90" y="-70" width="180" height="140" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
    <rect x="-76" y="-56" width="152" height="112" rx="6" fill="url(#screenGrad)"/>
    <rect x="-8" y="70" width="16" height="16" fill="#1e293b"/>
    <rect x="-20" y="86" width="40" height="6" rx="3" fill="#1e293b"/>
  </g>
</svg>