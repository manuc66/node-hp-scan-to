<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="44" fill="#ffffff"/>

  <!-- H inside screen — clean visual anchor -->
  <g transform="translate(100,100) scale(0.65)">
    <rect x="-100" y="-80" width="200" height="160" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
    <rect x="-86" y="-66" width="172" height="132" rx="6" fill="url(#screenGrad)"/>
    <rect x="-64" y="-50" width="24" height="100" rx="4" fill="#1e293b"/>
