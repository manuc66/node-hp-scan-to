name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the Node 22
      # runtime ships npm 10.x, so upgrade here. No NODE_AUTH_TOKEN is set:
      # npm authenticates via the GitHub OIDC identity instead.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public

  binaries:
    name: Binaries and packages
    runs-on: ubuntu-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Compute version
        id: ver
        run: |
          # Tag runs keep their own version (e.g. "1.11.0" or "1.11.0-rc.1");
          # manual runs are always the throwaway "0.0.0-dispatch".
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dispatch"
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: ./scripts/build-binaries.sh "v${{ steps.ver.outputs.version }}"

      - name: Install nfpm
        run: |
          NFPM_VERSION=v2.47.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_$(echo "$NFPM_VERSION" | tr -d v)_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin nfpm

      - name: Build deb and rpm packages
        # Pre-release versions (e.g. 1.11.0-rc.1) do not map to valid
        # deb/rpm/apk versions, so packages are only built for stable tags.
        if: steps.ver.outputs.prerelease != 'true'
        run: ./scripts/build-packages.sh "v${{ steps.ver.outputs.version }}"

      - name: Stage Windows installer inputs
        run: |
          mkdir -p packaging/windows/staging
          cp release/.staging/windows-x64/node-hp-scan-to.exe packaging/windows/staging/
          curl -fsSL -o packaging/windows/staging/WinSW-x64.exe \
            https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe

      - name: Build Windows installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          cd packaging/windows
          makensis -DVERSION="${{ steps.ver.outputs.version }}" installer.nsi

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          path: release/setup-node-hp-scan-to-v${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          archive: false

      - name: Sign installer with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'node-hp-scan-to' }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: release-signed

      - name: Move signed installer into place
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          mv release-signed/setup-node-hp-scan-to-*.exe release/

      - name: Upload darwin x64 binary for the macOS job
        # The .app/.pkg/.dmg are built natively on a macOS runner, but the
        # binaries themselves are cross-compiled here with bun.
        uses: actions/upload-artifact@v4
        with:
          name: darwin-x64
          path: release/.staging/darwin-x64/node-hp-scan-to
          if-no-files-found: error

      - name: Upload darwin arm64 binary for the macOS job
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: release/.staging/darwin-arm64/node-hp-scan-to
          if-no-files-found: error

      - name: Upload release artifacts for the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.deb
            release/*.apk
            release/*.rpm
            release/*.exe
          if-no-files-found: error

  macos:
    name: macOS .app, .pkg and .dmg
    runs-on: macos-latest
    needs: binaries
    env:
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_APPLE_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dispatch"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download darwin x64 binary
        uses: actions/download-artifact@v4
        with:
          name: darwin-x64
          path: release/.staging/darwin-x64

      - name: Download darwin arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: darwin-arm64
          path: release/.staging/darwin-arm64

      - name: Import signing certificate
        # macOS code signing needs the certificate in a keychain. No
        # certificate is needed for unsigned builds (the default).
        if: env.MACOS_CERT_BASE64 != ''
        run: |
          echo "$MACOS_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" \
            -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Build macOS packages
        run: |
          if [ -n "$MACOS_SIGNING_IDENTITY" ] || [ -n "$MACOS_CERT_BASE64" ]; then
            if [ -z "$MACOS_SIGNING_IDENTITY" ] && [ -n "$MACOS_CERT_BASE64" ]; then
              MACOS_SIGNING_IDENTITY="$(security find-identity -v -p codesigning \
                | awk -F'"' '/Developer ID Application/{print $2; exit}')"
            fi
            if [ -z "$MACOS_INSTALLER_IDENTITY" ] && [ -n "$MACOS_CERT_BASE64" ]; then
              MACOS_INSTALLER_IDENTITY="$(security find-identity -v -p basic \
                | awk -F'"' '/Developer ID Installer/{print $2; exit}')"
            fi
            export MACOS_SIGNING_IDENTITY
            if [ -n "$MACOS_INSTALLER_IDENTITY" ]; then
              export MACOS_INSTALLER_IDENTITY
            fi
          fi
          ./scripts/build-macos-packages.sh "v${{ steps.ver.outputs.version }}"

      - name: Upload macOS artifacts for the release job
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            release/*.pkg
            release/*.dmg
          if-no-files-found: error

  release:
    name: Assemble, sign checks and attach release assets
    runs-on: ubuntu-latest
    needs: [binaries, macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dispatch"
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' |
            xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload artifacts for manual testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-test
          path: |
            release/setup-node-hp-scan-to-*.exe
            release/node-hp-scan-to-*-macos.pkg
            release/node-hp-scan-to-*-macos.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.23.1
        with:
          path: .
          format: cyclonedx-json
          output-file: release/node-hp-scan-to.sbom.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.zip
            release/*.tar.gz
            release/*.deb
            release/*.apk
            release/*.rpm
            release/*.exe
            release/*.pkg
            release/*.dmg
            release/*.sbom.json
            release/SHA256SUMS.txt

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/*.sbom.json
          sbom-path: release/node-hp-scan-to.sbom.json

      - name: Compute release asset globs
        id: assets
        run: |
          if [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]]; then
            GLOBS="release/*.zip
                   release/*.tar.gz
                   release/*.exe
                   release/*.pkg
                   release/*.dmg
                   release/*.sbom.json
                   release/SHA256SUMS.txt"
          else
            GLOBS="release/*.zip
                   release/*.tar.gz
                   release/*.deb
                   release/*.apk
                   release/*.rpm
                   release/*.exe
                   release/*.pkg
                   release/*.dmg
                   release/*.sbom.json
                   release/SHA256SUMS.txt"
          fi
          echo "files<<GLOBSEOF" >> "$GITHUB_OUTPUT"
          echo "$GLOBS" >> "$GITHUB_OUTPUT"
          echo "GLOBSEOF" >> "$GITHUB_OUTPUT"

      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}

  aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    # The PKGBUILD sources the npm tarball, so npm must publish first.
    needs: npm
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    container:
      image: archlinux:base-devel
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      AUR_PACKAGE: ${{ vars.AUR_PACKAGE || 'node-hp-scan-to' }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Check AUR configuration
        id: cfg
        shell: bash
        run: echo "enabled=$([ -n "$AUR_SSH_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and create builder user
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          pacman -Syu --noconfirm git openssh pacman-contrib
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install SSH key for the builder user
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          echo "${AUR_SSH_KEY}" > /home/builder/.ssh/aur_key
          chown builder:builder /home/builder/.ssh/aur_key
          chmod 600 /home/builder/.ssh/aur_key

      - name: Clone, update and push the AUR package
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          cat > /tmp/update-aur.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" src
          # AUR does not publish host keys over DNS; accept-new records the
          # key on first contact (still verified on every later connection).
          export GIT_SSH_COMMAND="ssh -i /home/builder/.ssh/aur_key -o StrictHostKeyChecking=accept-new"
          git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" aur

          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/; s/^pkgrel=.*/pkgrel=1/" \
            src/packaging/arch/PKGBUILD
          cp src/packaging/arch/PKGBUILD aur/PKGBUILD
          cp src/packaging/arch/node-hp-scan-to.install aur/

          cd aur
          updpkgsums
          makepkg --printsrcinfo > .SRCINFO

          git config user.name "${ACTOR}"
          git config user.email "${ACTOR}@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || \
            git commit -m "upstream release ${GITHUB_REF_NAME}"
          git push origin master
          SCRIPT
          chown builder:builder /tmp/update-aur.sh
          su builder -c "bash /tmp/update-aur.sh"

  winget:
    name: Submit to winget
    runs-on: windows-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    env:
      WINGET_CREATE_TOKEN: ${{ secrets.WINGET_CREATE_TOKEN }}
    steps:
      - name: Check winget configuration
        id: cfg
        shell: pwsh
        run: |
          if ($env:WINGET_CREATE_TOKEN) { $enabled = 'true' } else { $enabled = 'false' }
          "enabled=$enabled" >> $env:GITHUB_OUTPUT

      # Requires a one-time manual submission of the package first:
      #   wingetcreate new <installer-url> --submit --token <pat>
      # Afterwards every tag opens the version-bump PR automatically.
      - name: Open winget-pkgs version PR
        if: steps.cfg.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)
          $url = "https://github.com/${env:GITHUB_REPOSITORY}/releases/download/${env:GITHUB_REF_NAME}/setup-node-hp-scan-to-v$version.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate update manuc66.node-hp-scan-to `
            --version $version --urls $url `
            --submit --token "$env:WINGET_CREATE_TOKEN"
